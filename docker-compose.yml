version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: mi-michi-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-mi_michi}

  backend:
    build: .
    container_name: mi-michi-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      MONGO_DB: ${MONGO_DB:-mi_michi}
      AUTH_MODE: ${AUTH_MODE:-dev}
    depends_on:
      - mongo

volumes:
  mongo_data:
